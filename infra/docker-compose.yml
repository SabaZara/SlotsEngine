services:
  mongo:
    image: mongo:7
    # A single-node replica set, not a standalone: the money path needs
    # transactions, and Mongo only provides them on a replica set. This is
    # the most common reason a fresh checkout fails to spin.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      # Host ports are configurable so this stack can run alongside another
      # one on the same machine without a port clash.
      - "${MONGO_HOST_PORT:-27018}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first boot, then reports healthy once
      # it answers. Idempotent — an already-initiated set just errors
      # harmlessly and the ping succeeds.
      test: >
        mongosh --quiet --eval "
          try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }
          db.adminCommand('ping')
        "
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Object storage for game artwork and audio.
  #
  # The bucket is PRIVATE, and every read goes through a signed URL minted
  # at serve time — so a URL that leaks stops working within the day rather
  # than forever. `ensureBucket()` clears any bucket policy on every boot
  # rather than only at creation, because a bucket that already exists from
  # an earlier deployment would otherwise keep a public-read policy
  # indefinitely; that is the reference repo's recorded mistake.
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9011"]
    environment:
      MINIO_ROOT_USER: ${ASSET_ACCESS_KEY:-dev-asset-key}
      MINIO_ROOT_PASSWORD: ${ASSET_SECRET_KEY:-dev-asset-secret-change-me}
    ports:
      # Published because a BROWSER fetches signed URLs directly — unlike
      # mongo, this one genuinely has to be reachable from the host. The
      # staging overlay is where that becomes a real exposure decision.
      - "${ASSET_HOST_PORT:-9010}:9000"
      - "${ASSET_CONSOLE_PORT:-9011}:9011"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # Every buildable service carries BOTH `image:` and `build:`.
  #
  # `build:` is what a developer uses — `docker compose up --build` compiles
  # from source and tags the result as `image:`, so local behaviour is
  # unchanged. `image:` is what a deploy uses: with REGISTRY and TAG set,
  # `docker compose pull` fetches the exact images CI built for one commit
  # and `up -d` runs them without the box ever compiling anything.
  #
  # The defaults matter. `slots-engine/<service>:local` is a name no registry
  # serves, so a `pull` without REGISTRY set fails loudly instead of quietly
  # fetching someone else's image, and a local build cannot be mistaken for a
  # released one when reading `docker images`.
  game-backend:
    image: ${REGISTRY:-slots-engine}/game-backend:${TAG:-local}
    build:
      context: ..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: game-backend
    environment:
      PORT: 9002
      # ASSET_ENDPOINT is the in-network address this service uses;
      # ASSET_PUBLIC_ENDPOINT is the browser-reachable one a signed URL is
      # signed against. They must differ, because a signature is computed
      # against the host the request will actually be made to.
      ASSET_ENDPOINT: ${ASSET_ENDPOINT:-http://minio:9000}
      ASSET_PUBLIC_ENDPOINT: ${ASSET_PUBLIC_ENDPOINT:-http://localhost:9010}
      ASSET_ACCESS_KEY: ${ASSET_ACCESS_KEY:-dev-asset-key}
      ASSET_SECRET_KEY: ${ASSET_SECRET_KEY:-dev-asset-secret-change-me}
      ASSET_BUCKET: ${ASSET_BUCKET:-game-assets}
      # Interpolated like every other variable here, and it was the one
      # exception: the value was hardcoded, so editing MONGO_URI in
      # `infra/.env` changed nothing and nothing said so. A setting that
      # looks configurable and is ignored is worse than one that is plainly
      # fixed, because the edit appears to have worked.
      #
      # The default is the in-network address and deliberately carries NO
      # `directConnection=true`. That flag belongs on HOST-side connections
      # only — see `.env.example`. From inside this network the replica set
      # advertises itself as `mongo:27017`, which resolves, so following the
      # advertisement is correct here and the flag would suppress the very
      # topology discovery that makes transactions work on a failover.
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/slots_engine?replicaSet=rs0}
      MONGO_DB: ${MONGO_DB:-slots_engine}
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET}
      LAUNCH_TOKEN_SECRET: ${LAUNCH_TOKEN_SECRET}
      INITIAL_PLAYER_BALANCE: ${INITIAL_PLAYER_BALANCE:-100000}
      # Seeds the pick-bonus test fixture. Never set in production — the
      # guard in games.ts refuses it there regardless.
      SEED_TEST_FIXTURES: ${SEED_TEST_FIXTURES:-false}
      GAME_CORS_ORIGINS: ${GAME_CORS_ORIGINS:-http://localhost:9104}
      # Requests per minute, keyed by service caller for /internal and by
      # IP for /public. Health is exempt.
      GAME_RATE_LIMIT: ${GAME_RATE_LIMIT:-600}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      # Exposed for local development only. In a real deployment this port
      # is never published: the internal API is signed, but defence in
      # depth means it also shouldn't be reachable from outside.
      - "${GAME_BACKEND_HOST_PORT:-9102}:9002"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9002/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  game-socket:
    image: ${REGISTRY:-slots-engine}/game-socket:${TAG:-local}
    build:
      context: ..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: game-socket
    environment:
      PORT: 9003
      GAME_BACKEND_URL: http://game-backend:9002
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET}
      LAUNCH_TOKEN_SECRET: ${LAUNCH_TOKEN_SECRET}
      # Per-connection token buckets: spins are limited tightly because
      # each is a transaction; other messages get an anti-flood ceiling.
      SOCKET_SPIN_RATE: ${SOCKET_SPIN_RATE:-5}
      SOCKET_SPIN_BURST: ${SOCKET_SPIN_BURST:-10}
      SOCKET_MSG_RATE: ${SOCKET_MSG_RATE:-25}
      SOCKET_MSG_BURST: ${SOCKET_MSG_BURST:-50}
      SOCKET_MAX_CONNECTIONS: ${SOCKET_MAX_CONNECTIONS:-5000}
      # Handshake origin allowlist. Falls back to the same value the HTTP
      # surface uses, so the two cannot drift apart by accident.
      SOCKET_ALLOWED_ORIGINS: ${SOCKET_ALLOWED_ORIGINS:-${GAME_CORS_ORIGINS:-http://localhost:9104}}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "${GAME_SOCKET_HOST_PORT:-9103}:9003"
    depends_on:
      game-backend:
        condition: service_healthy

  backoffice-api:
    image: ${REGISTRY:-slots-engine}/backoffice-api:${TAG:-local}
    build:
      context: ..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: backoffice-api
    environment:
      PORT: 9005
      # ASSET_ENDPOINT is the in-network address this service uses;
      # ASSET_PUBLIC_ENDPOINT is the browser-reachable one a signed URL is
      # signed against. They must differ, because a signature is computed
      # against the host the request will actually be made to.
      ASSET_ENDPOINT: ${ASSET_ENDPOINT:-http://minio:9000}
      ASSET_PUBLIC_ENDPOINT: ${ASSET_PUBLIC_ENDPOINT:-http://localhost:9010}
      ASSET_ACCESS_KEY: ${ASSET_ACCESS_KEY:-dev-asset-key}
      ASSET_SECRET_KEY: ${ASSET_SECRET_KEY:-dev-asset-secret-change-me}
      ASSET_BUCKET: ${ASSET_BUCKET:-game-assets}
      # Interpolated like every other variable here, and it was the one
      # exception: the value was hardcoded, so editing MONGO_URI in
      # `infra/.env` changed nothing and nothing said so. A setting that
      # looks configurable and is ignored is worse than one that is plainly
      # fixed, because the edit appears to have worked.
      #
      # The default is the in-network address and deliberately carries NO
      # `directConnection=true`. That flag belongs on HOST-side connections
      # only — see `.env.example`. From inside this network the replica set
      # advertises itself as `mongo:27017`, which resolves, so following the
      # advertisement is correct here and the flag would suppress the very
      # topology discovery that makes transactions work on a failover.
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/slots_engine?replicaSet=rs0}
      MONGO_DB: ${MONGO_DB:-slots_engine}
      BACKOFFICE_JWT_SECRET: ${BACKOFFICE_JWT_SECRET}
      # This service ISSUES operator credentials, so it holds the same key
      # integration-api uses to read them back. The two must match, or a
      # credential created here cannot be decrypted there — and the only
      # symptom is every call from that operator failing authentication.
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY}
      BACKOFFICE_CORS_ORIGINS: ${BACKOFFICE_CORS_ORIGINS:-http://localhost:9106}
      BACKOFFICE_RATE_LIMIT: ${BACKOFFICE_RATE_LIMIT:-300}
      # Login gets a far tighter ceiling than ordinary admin traffic.
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      # Per-account lockout, which the per-IP limit above cannot provide:
      # an attacker distributed across addresses gets the IP allowance from
      # every one of them.
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-10}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
      LOGIN_ATTEMPT_WINDOW_MINUTES: ${LOGIN_ATTEMPT_WINDOW_MINUTES:-15}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "${BACKOFFICE_API_HOST_PORT:-9105}:9005"
    depends_on:
      mongo:
        condition: service_healthy

  # The operator-facing edge: the one service a customer's servers talk to
  # directly. Everything else in this stack is either internal or reached by
  # a player's browser.
  integration-api:
    image: ${REGISTRY:-slots-engine}/integration-api:${TAG:-local}
    build:
      context: ..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: integration-api
    environment:
      PORT: 9006
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/slots_engine?replicaSet=rs0}
      MONGO_DB: ${MONGO_DB:-slots_engine}
      # Mints the launch tokens game-socket verifies, so this must be the
      # SAME value those services hold — a mismatch means every launch
      # produces a token the socket refuses, and the only symptom is players
      # unable to join.
      LAUNCH_TOKEN_SECRET: ${LAUNCH_TOKEN_SECRET}
      # Decrypts operator API secrets. Held only by the services that read
      # or write them — this one and backoffice-api — rather than added to
      # the stack-wide set, so a service that has no business decrypting a
      # credential cannot.
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY}
      # Where a launch URL points the player's browser. A browser-reachable
      # host port, never the internal service name.
      GAME_FRONTEND_URL: ${PUBLIC_GAME_FRONTEND_URL:-http://localhost:9104}
      # Requests per minute, keyed by the claimed operator key rather than
      # by IP — operators commonly share an egress address, and an IP bucket
      # lets one starve another. See the note in app.ts.
      INTEGRATION_RATE_LIMIT: ${INTEGRATION_RATE_LIMIT:-300}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "${INTEGRATION_API_HOST_PORT:-9107}:9006"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9006/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # A reference integrator, standing in for an aggregator's own lobby. Not
  # part of the platform: it is the worked example of docs/INTEGRATION.md,
  # and it holds an operator credential the way a partner's backend would.
  #
  # Deliberately has NO default credentials and refuses to start without
  # them — create an operator in the backoffice, then put its values in
  # infra/.env. The reference repo defaults these to a fixed dev secret and
  # boot-seeds a matching operator, which is convenient right up until that
  # seed runs somewhere real.
  #
  # Started only when asked for: `docker compose --profile demo up -d`.
  # It is a demonstration, not a service the platform needs.
  operator-demo:
    profiles: ["demo"]
    image: ${REGISTRY:-slots-engine}/operator-demo:${TAG:-local}
    build:
      context: ..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: operator-demo
    environment:
      PORT: 9008
      # The in-network address: this is a server-to-server call, not one a
      # browser makes.
      INTEGRATION_API_URL: ${INTEGRATION_API_INTERNAL_URL:-http://integration-api:9006}
      OPERATOR_ID: ${DEMO_OPERATOR_ID:-demo}
      # Defaulted to empty rather than left bare, and the difference is not
      # cosmetic: a bare `${VAR}` makes compose warn on EVERY command in
      # this file — `up`, `config`, `logs`, all of them — for a service that
      # is profile-gated and usually not running at all. Warnings that fire
      # on unrelated commands are how people learn to skip reading them.
      #
      # Empty is safe here because operator-demo refuses to start without
      # real values, so the check that matters happens where it can say
      # something useful, rather than as compose noise everyone else sees.
      OPERATOR_API_KEY_ID: ${DEMO_OPERATOR_API_KEY_ID:-}
      OPERATOR_API_SECRET: ${DEMO_OPERATOR_API_SECRET:-}
      DEMO_TOPUP_AMOUNT: ${DEMO_TOPUP_AMOUNT:-100000}
    ports:
      - "${OPERATOR_DEMO_HOST_PORT:-9108}:9008"
    depends_on:
      integration-api:
        condition: service_healthy

  backoffice-frontend:
    image: ${REGISTRY:-slots-engine}/backoffice-frontend:${TAG:-local}
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        APP: backoffice-frontend
        VITE_BACKOFFICE_API_URL: ${PUBLIC_BACKOFFICE_API_URL:-http://localhost:9105}
    ports:
      - "${BACKOFFICE_FRONTEND_HOST_PORT:-9106}:80"
    depends_on:
      backoffice-api:
        condition: service_started

  game-frontend:
    image: ${REGISTRY:-slots-engine}/game-frontend:${TAG:-local}
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        APP: game-frontend
        # Baked into the bundle at build time, so these are the addresses a
        # BROWSER must be able to reach — the host ports, never the internal
        # service names.
        VITE_GAME_BACKEND_URL: ${PUBLIC_GAME_BACKEND_URL:-http://localhost:9102}
        VITE_GAME_SOCKET_URL: ${PUBLIC_GAME_SOCKET_URL:-ws://localhost:9103}
    ports:
      - "${GAME_FRONTEND_HOST_PORT:-9104}:80"
    depends_on:
      game-socket:
        condition: service_started

volumes:
  mongo-data:
  minio-data:
