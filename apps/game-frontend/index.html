<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Slots Engine</title>
    <style>
      :root {
        --bg: #05070f;
        --panel: rgba(255, 255, 255, 0.05);
        --border: rgba(79, 209, 255, 0.18);
        --text: #e6edf7;
        --muted: #7c93b8;
        --accent: #4fd1ff;
        --win: #ffd166;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 system-ui, -apple-system, sans-serif;
        display: grid;
        grid-template-rows: auto 1fr auto;
        overflow: hidden;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 20px;
        border-bottom: 1px solid var(--border);
      }
      #game-name { font-weight: 600; letter-spacing: 0.01em; }
      .readout { display: flex; align-items: baseline; gap: 8px; }
      .readout .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
      #balance { font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 600; }
      /* `tabular-nums` is load-bearing rather than decorative: a counting-up
         figure in a proportional font reflows on every frame as digit widths
         change, so the number visibly jitters while it counts. */
      #win { color: var(--win); font-weight: 600; font-variant-numeric: tabular-nums; transition: color .2s, transform .2s; }

      /* Tier is set by the count-up as it crosses each threshold, so the
         emphasis arrives with the number rather than being decided up front
         — the player watches it become a big win. */
      #win[data-tier="big"] { color: #ffd166; transform: scale(1.12); }
      #win[data-tier="mega"] {
        color: #fff;
        transform: scale(1.28);
        text-shadow: 0 0 12px rgba(255, 209, 102, .9), 0 0 28px rgba(255, 209, 102, .5);
      }
      /* A losing spin clears the tier, so the previous round's emphasis does
         not linger over a new result. */
      #win[data-tier="none"] { transform: none; }
      #win[data-tier="win"] { transform: none; }

      @media (prefers-reduced-motion: reduce) {
        /* The number still counts and still changes colour; only the scaling
           is dropped. Motion is the part that causes trouble, and the
           information is carried by the figure itself either way. */
        #win { transition: color .2s; }
        #win[data-tier="big"] { transform: none; }
        #win[data-tier="mega"] { transform: none; }
      }

      /* Verified on the running client, with one trap worth recording for
         whoever checks this next: these tiers CANNOT be read with
         `getComputedStyle` in a background or throttled tab. Transitions are
         driven by the same frame clock as `requestAnimationFrame`, which such
         a tab stops entirely — so a probe reads a transition frozen at its
         start value and reports `transform: matrix(1,0,0,1,0,0)` for a rule
         that plainly declares `scale(1.28)`. The tell is that `text-shadow`,
         which has no transition, applies while `color` and `transform` from
         the very same rule do not. Set `style.transition = "none"` before
         measuring. Measured this way all four tiers are correct: none/win
         flat, big 1.12x, mega 1.28x white with a glow. */

      main { position: relative; min-height: 0; }
      #reels { width: 100%; height: 100%; display: block; cursor: pointer; }

      #bonus {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: rgba(5, 7, 15, 0.88);
        backdrop-filter: blur(6px);
      }
      #bonus[hidden] { display: none; }
      #bonus strong { font-size: 20px; letter-spacing: 0.02em; }
      .tiles { display: grid; grid-template-columns: repeat(3, 76px); gap: 12px; }
      .tile {
        aspect-ratio: 1;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--panel);
        color: var(--text);
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
      }
      .tile:disabled { opacity: 0.55; cursor: default; }
      .tile:not(:disabled):hover { border-color: var(--accent); }

      /* The wheel bonus. Only `.wheel-face` rotates — the pointer is fixed
         at 12 o'clock, which is the contract `wheelGeometry.ts` documents
         and the reason the two are siblings rather than nested. */
      .wheel-stage { position: relative; width: 180px; height: 180px; }
      .wheel-face {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid var(--border);
        /* `background` is set from JS as a conic-gradient built from the
           segment table the server sent. */
      }
      .wheel-label {
        position: absolute;
        top: 50%;
        left: 50%;
        margin: -9px 0 0 -18px;
        width: 36px;
        text-align: center;
        font-size: 13px;
        font-weight: 700;
        color: #06101c;
        /* transform is set per label so the text stays upright as the wheel
           turns beneath it. */
      }
      .wheel-pointer {
        position: absolute;
        top: -10px;
        left: 50%;
        margin-left: -9px;
        width: 0;
        height: 0;
        border-left: 9px solid transparent;
        border-right: 9px solid transparent;
        border-top: 16px solid var(--accent);
      }
      /* A player who has asked for less motion still needs the result, so
         the wheel lands on its segment without the spin rather than not at
         all. */
      @media (prefers-reduced-motion: reduce) {
        .wheel-face { transition: none !important; }
      }

      .autoplay { display: flex; align-items: center; gap: 12px; padding-top: 8px; flex-wrap: wrap; }
      #autoplay-counts { display: flex; gap: 6px; }
      .autoplay-count[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
      .autoplay-stop-on-win { display: flex; align-items: center; gap: 6px; font-size: 13px; }
      #autoplay-remaining { font-variant-numeric: tabular-nums; opacity: 0.8; font-size: 13px; }
      /* Disabled controls are dimmed rather than hidden: a control that
         vanishes mid-run reads as a broken panel, and its absence gives the
         player no clue that it will come back. */
      .autoplay button:disabled, .autoplay input:disabled { opacity: 0.5; cursor: default; }

      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 14px 20px;
        border-top: 1px solid var(--border);
        flex-wrap: wrap;
      }
      #bets { display: flex; gap: 8px; flex-wrap: wrap; }
      .bet {
        padding: 8px 14px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        cursor: pointer;
      }
      .bet.selected { color: var(--bg); background: var(--accent); border-color: var(--accent); font-weight: 600; }

      #spin {
        padding: 12px 40px;
        border: none;
        border-radius: 999px;
        background: var(--accent);
        color: #04121b;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.02em;
        cursor: pointer;
      }
      #spin:disabled { opacity: 0.4; cursor: default; }

      #status { color: var(--muted); font-size: 13px; min-height: 1.5em; }

      details { color: var(--muted); font-size: 13px; }
      summary { cursor: pointer; }
      #paytable table { border-collapse: collapse; margin-top: 8px; }
      #paytable td { padding: 3px 14px 3px 0; font-variant-numeric: tabular-nums; }
      #paytable td:first-child { color: var(--text); }
    </style>
  </head>
  <body>
    <header>
      <span id="game-name">Loading…</span>
      <div class="readout"><span class="label">Balance</span><span id="balance">—</span></div>
    </header>

    <main>
      <canvas id="reels"></canvas>
      <div id="bonus" hidden></div>
    </main>

    <footer>
      <div id="bets"></div>
      <button id="spin" disabled>Spin</button>
      <div>
        <div id="status">Starting…</div>
        <div id="win"></div>
      </div>
      <!-- Collapsed by default. Autoplay is a deliberate choice rather than
           an obvious button: it commits a player to a run of real bets, so
           it should take a moment's intent to reach. -->
      <details id="autoplay-panel">
        <summary>Autoplay</summary>
        <div class="autoplay">
          <div id="autoplay-counts" role="group" aria-label="Number of spins"></div>
          <label class="autoplay-stop-on-win">
            <input type="checkbox" id="autoplay-stop-on-win" />
            Stop on any win
          </label>
          <button id="autoplay-toggle" type="button">Start</button>
          <span id="autoplay-remaining" aria-live="polite"></span>
        </div>
      </details>
      <details>
        <summary>Paytable</summary>
        <div id="paytable"></div>
      </details>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
