<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Slots Engine</title>
    <style>
      :root {
        --bg: #05070f;
        --panel: rgba(255, 255, 255, 0.05);
        --border: rgba(79, 209, 255, 0.18);
        --text: #e6edf7;
        --muted: #7c93b8;
        --accent: #4fd1ff;
        --win: #ffd166;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 system-ui, -apple-system, sans-serif;
        display: grid;
        grid-template-rows: auto 1fr auto;
        overflow: hidden;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 20px;
        border-bottom: 1px solid var(--border);
      }
      #game-name { font-weight: 600; letter-spacing: 0.01em; }
      .readout { display: flex; align-items: baseline; gap: 8px; }
      .readout .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
      #balance { font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 600; }
      #win { color: var(--win); font-weight: 600; font-variant-numeric: tabular-nums; }

      main { position: relative; min-height: 0; }
      #reels { width: 100%; height: 100%; display: block; cursor: pointer; }

      #bonus {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: rgba(5, 7, 15, 0.88);
        backdrop-filter: blur(6px);
      }
      #bonus[hidden] { display: none; }
      #bonus strong { font-size: 20px; letter-spacing: 0.02em; }
      .tiles { display: grid; grid-template-columns: repeat(3, 76px); gap: 12px; }
      .tile {
        aspect-ratio: 1;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--panel);
        color: var(--text);
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
      }
      .tile:disabled { opacity: 0.55; cursor: default; }
      .tile:not(:disabled):hover { border-color: var(--accent); }

      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 14px 20px;
        border-top: 1px solid var(--border);
        flex-wrap: wrap;
      }
      #bets { display: flex; gap: 8px; flex-wrap: wrap; }
      .bet {
        padding: 8px 14px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        cursor: pointer;
      }
      .bet.selected { color: var(--bg); background: var(--accent); border-color: var(--accent); font-weight: 600; }

      #spin {
        padding: 12px 40px;
        border: none;
        border-radius: 999px;
        background: var(--accent);
        color: #04121b;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.02em;
        cursor: pointer;
      }
      #spin:disabled { opacity: 0.4; cursor: default; }

      #status { color: var(--muted); font-size: 13px; min-height: 1.5em; }

      details { color: var(--muted); font-size: 13px; }
      summary { cursor: pointer; }
      #paytable table { border-collapse: collapse; margin-top: 8px; }
      #paytable td { padding: 3px 14px 3px 0; font-variant-numeric: tabular-nums; }
      #paytable td:first-child { color: var(--text); }
    </style>
  </head>
  <body>
    <header>
      <span id="game-name">Loading…</span>
      <div class="readout"><span class="label">Balance</span><span id="balance">—</span></div>
    </header>

    <main>
      <canvas id="reels"></canvas>
      <div id="bonus" hidden></div>
    </main>

    <footer>
      <div id="bets"></div>
      <button id="spin" disabled>Spin</button>
      <div>
        <div id="status">Starting…</div>
        <div id="win"></div>
      </div>
      <details>
        <summary>Paytable</summary>
        <div id="paytable"></div>
      </details>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
